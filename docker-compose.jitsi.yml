# LonghuaCRM — corporate self-hosted Jitsi (JWT-only, no public guests).
#
# CRM is the only identity/ACL layer. Clients join with a short-lived HS256 JWT
# signed by Nest (JitsiJwtService). Telegram/share links always point at CRM
# `/lesson/:id/video`, never at raw Jitsi room URLs.
#
# Quick start:
#   1. cp env.jitsi.example .env.jitsi && edit secrets / PUBLIC_URL / JVB_ADVERTISE_IPS
#   2. mkdir -p ~/.jitsi-meet-cfg/{web,transcripts,prosody/config,prosody/prosody-plugins-custom,jicofo,jvb}
#   3. docker compose -f docker-compose.jitsi.yml --env-file .env.jitsi up -d
#   4. Tunnel: /meet* → 127.0.0.1:8000 ; catch-all → :3001
#   5. CRM .env:
#        JITSI_BASE_URL=https://lk.longhuachinese.online/meet
#        JITSI_JWT_APP_ID=...  JITSI_JWT_APP_SECRET=... (match JWT_* below)
#
# Primary routing: path prefix /meet on lk.longhuachinese.online
# Fallback (if WebRTC/XMPP breaks under path): meet.longhuachinese.online subdomain
#   — update PUBLIC_URL + JITSI_BASE_URL; CRM UX stays /lesson/:id/video
#
# Based on jitsi/docker-jitsi-meet.

services:
  web:
    image: jitsi/web:${JITSI_IMAGE_VERSION:-stable-10008}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${JITSI_HTTP_PORT:-8000}:80'
    volumes:
      - ${CONFIG:-~/.jitsi-meet-cfg}/web:/config:Z
      - ${CONFIG:-~/.jitsi-meet-cfg}/transcripts:/usr/share/jitsi-meet/transcripts:Z
      - /opt/longhuaCRM/jitsi/plugin.head.html:/usr/share/jitsi-meet/plugin.head.html:ro
    environment:
      ENABLE_AUTH: ${ENABLE_AUTH:-1}
      ENABLE_GUESTS: ${ENABLE_GUESTS:-0}
      AUTH_TYPE: ${AUTH_TYPE:-jwt}
      ENABLE_LETSENCRYPT: 0
      ENABLE_HTTP_REDIRECT: 0
      ENABLE_WELCOME_PAGE: 0
      ENABLE_CLOSE_PAGE: 0
      DISABLE_HTTPS: ${DISABLE_HTTPS:-1}
      PUBLIC_URL: ${PUBLIC_URL}
      XMPP_DOMAIN: ${XMPP_DOMAIN:-meet.jitsi}
      XMPP_AUTH_DOMAIN: ${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_BOSH_URL_BASE: http://xmpp.meet.jitsi:5280
      XMPP_GUEST_DOMAIN: ${XMPP_GUEST_DOMAIN:-guest.meet.jitsi}
      XMPP_MUC_DOMAIN: ${XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      XMPP_RECORDER_DOMAIN: ${XMPP_RECORDER_DOMAIN:-recorder.meet.jitsi}
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JIGASI_XMPP_PASSWORD: ${JIGASI_XMPP_PASSWORD:-}
      JIBRI_RECORDER_PASSWORD: ${JIBRI_RECORDER_PASSWORD:-}
      JIBRI_XMPP_PASSWORD: ${JIBRI_XMPP_PASSWORD:-}
      JWT_APP_ID: ${JWT_APP_ID}
      JWT_APP_SECRET: ${JWT_APP_SECRET}
      JWT_ACCEPTED_ISSUERS: ${JWT_ACCEPTED_ISSUERS:-${JWT_APP_ID}}
      JWT_ACCEPTED_AUDIENCES: ${JWT_ACCEPTED_AUDIENCES:-jitsi}
      JWT_ALLOW_EMPTY: 0
      # 1:1 lessons need P2P — JVB UDP ICE has been failing (0s oversending).
      ENABLE_P2P: ${ENABLE_P2P:-1}
      ENABLE_COLIBRI_WEBSOCKET: ${ENABLE_COLIBRI_WEBSOCKET:-1}
      ENABLE_XMPP_WEBSOCKET: ${ENABLE_XMPP_WEBSOCKET:-1}
      TZ: ${TZ:-Europe/Minsk}
      DEFAULT_LANGUAGE: ru
    networks:
      meet.jitsi:
        aliases:
          - meet.jitsi
    depends_on:
      - jvb
      - prosody

  prosody:
    image: jitsi/prosody:${JITSI_IMAGE_VERSION:-stable-10008}
    restart: unless-stopped
    volumes:
      - ${CONFIG:-~/.jitsi-meet-cfg}/prosody/config:/config:Z
      - ${CONFIG:-~/.jitsi-meet-cfg}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z
    environment:
      AUTH_TYPE: ${AUTH_TYPE:-jwt}
      ENABLE_AUTH: ${ENABLE_AUTH:-1}
      ENABLE_GUESTS: ${ENABLE_GUESTS:-0}
      PUBLIC_URL: ${PUBLIC_URL}
      XMPP_DOMAIN: ${XMPP_DOMAIN:-meet.jitsi}
      XMPP_AUTH_DOMAIN: ${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_GUEST_DOMAIN: ${XMPP_GUEST_DOMAIN:-guest.meet.jitsi}
      XMPP_MUC_DOMAIN: ${XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      XMPP_RECORDER_DOMAIN: ${XMPP_RECORDER_DOMAIN:-recorder.meet.jitsi}
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JIGASI_XMPP_PASSWORD: ${JIGASI_XMPP_PASSWORD:-}
      JIBRI_RECORDER_PASSWORD: ${JIBRI_RECORDER_PASSWORD:-}
      JIBRI_XMPP_PASSWORD: ${JIBRI_XMPP_PASSWORD:-}
      JWT_APP_ID: ${JWT_APP_ID}
      JWT_APP_SECRET: ${JWT_APP_SECRET}
      JWT_ACCEPTED_ISSUERS: ${JWT_ACCEPTED_ISSUERS:-${JWT_APP_ID}}
      JWT_ACCEPTED_AUDIENCES: ${JWT_ACCEPTED_AUDIENCES:-jitsi}
      JWT_ALLOW_EMPTY: 0
      TZ: ${TZ:-Europe/Minsk}
      # TURN/STUN discovery for browsers (XEP-0215). Shared secret → time-limited creds.
      # TURN_HOST must be origin public IP (not Cloudflare-proxied meet.* DNS).
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_TRANSPORT: ${TURN_TRANSPORT:-udp,tcp}
      TURN_CREDENTIALS: ${TURN_CREDENTIALS:-}
      TURN_TTL: ${TURN_TTL:-86400}
      STUN_HOST: ${STUN_HOST:-}
      STUN_PORT: ${STUN_PORT:-3478}
    networks:
      meet.jitsi:
        aliases:
          - xmpp.meet.jitsi

  jicofo:
    image: jitsi/jicofo:${JITSI_IMAGE_VERSION:-stable-10008}
    restart: unless-stopped
    volumes:
      - ${CONFIG:-~/.jitsi-meet-cfg}/jicofo:/config:Z
    environment:
      AUTH_TYPE: ${AUTH_TYPE:-jwt}
      ENABLE_AUTH: ${ENABLE_AUTH:-1}
      ENABLE_GUESTS: ${ENABLE_GUESTS:-0}
      XMPP_DOMAIN: ${XMPP_DOMAIN:-meet.jitsi}
      XMPP_AUTH_DOMAIN: ${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      XMPP_MUC_DOMAIN: ${XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      XMPP_SERVER: xmpp.meet.jitsi
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JICOFO_AUTH_USER: focus
      JVB_BREWERY_MUC: jvbbrewery
      TZ: ${TZ:-Europe/Minsk}
    depends_on:
      - prosody
    networks:
      meet.jitsi:

  jvb:
    image: jitsi/jvb:${JITSI_IMAGE_VERSION:-stable-10008}
    restart: unless-stopped
    ports:
      - '${JVB_PORT:-10000}:${JVB_PORT:-10000}/udp'
    volumes:
      - ${CONFIG:-~/.jitsi-meet-cfg}/jvb:/config:Z
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      XMPP_AUTH_DOMAIN: ${XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      XMPP_SERVER: xmpp.meet.jitsi
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JVB_BREWERY_MUC: jvbbrewery
      JVB_PORT: ${JVB_PORT:-10000}
      JVB_STUN_SERVERS: ${JVB_STUN_SERVERS:-meet-jit-si-turnrelay.jitsi.net:443}
      JVB_ADVERTISE_IPS: ${JVB_ADVERTISE_IPS}
      # Do not offer docker bridge IPs (172.*) to internet clients.
      JVB_ADVERTISE_PRIVATE_CANDIDATES: ${JVB_ADVERTISE_PRIVATE_CANDIDATES:-false}
      ENABLE_COLIBRI_WEBSOCKET: ${ENABLE_COLIBRI_WEBSOCKET:-1}
      JVB_WS_SERVER_ID: ${JVB_WS_SERVER_ID:-172.19.0.2}
      TZ: ${TZ:-Europe/Minsk}
    depends_on:
      - prosody
    networks:
      meet.jitsi:

  # Production TURN/STUN for browsers behind NAT/CGNAT.
  # Prosody advertises time-limited credentials via XEP-0215 (TURN_CREDENTIALS).
  # Host networking avoids Docker NAT rewriting of relay candidates.
  # IMPORTANT: TURN_HOST must be the origin public IP (JVB_ADVERTISE_IPS), NOT a
  # Cloudflare-proxied hostname — UDP/TCP 3478 is not proxied by CF orange-cloud.
  coturn:
    image: coturn/coturn:4.6.2-r12
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/longhuaCRM/jitsi/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      TURN_CREDENTIALS: ${TURN_CREDENTIALS}
      TURN_REALM: ${TURN_REALM:-meet.longhuachinese.online}
      JVB_ADVERTISE_IPS: ${JVB_ADVERTISE_IPS}
      TURN_LOCAL_IP: ${TURN_LOCAL_IP:-192.168.0.140}
      TZ: ${TZ:-Europe/Minsk}
    # Override entrypoint so we can inject shared secret + external-ip from env.
    entrypoint:
      - turnserver
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_CREDENTIALS}
      - --realm=${TURN_REALM:-meet.longhuachinese.online}
      # public/private form required when origin is behind NAT
      - --external-ip=${JVB_ADVERTISE_IPS}/${TURN_LOCAL_IP:-192.168.0.140}
      - --listening-ip=0.0.0.0
      - --relay-ip=${TURN_LOCAL_IP:-192.168.0.140}    # No depends_on on prosody — coturn is independent; clients discover it via Prosody.

networks:
  meet.jitsi:
