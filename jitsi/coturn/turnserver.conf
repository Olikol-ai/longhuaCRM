# LonghuaCRM coturn (TURN/STUN) for Jitsi WebRTC.
# Used with Prosody mod_external_services + TURN_CREDENTIALS (time-limited REST creds).
# Do NOT put static username/password in the CRM frontend.
#
# listening / relay bind to all interfaces; advertise public IP via --external-ip.
# Ports: 3478/udp+tcp (TURN/STUN), 49160-49169/udp (relay — matches Huawei WS5200 forwards).

listening-ip=0.0.0.0
listening-port=3478
min-port=49160
max-port=49169

fingerprint
use-auth-secret
# Shared secret only (draft-uberti time-limited creds via Prosody).
# Do not enable lt-cred-mech alongside use-auth-secret.

realm=meet.longhuachinese.online

no-multicast-peers
no-cli
no-tls
no-dtls
no-stdout-timestamps
simple-log
log-file=stdout

# Deny loopback / link-local peer abuse
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Allow localhost for health probes from this host only if needed:
# allowed-peer-ip=127.0.0.1
