version: "3.9"

# Production stack for greenfield Docker hosts (API + PostgreSQL).
# Canonical production path on the current Longhua server (/opt/longhuaCRM) is ./deploy.sh.
# Use this file only when the whole stack runs in Docker.
#   POSTGRES_PASSWORD and JWT_SECRET and APP_PUBLIC_URL are required (no defaults).

services:
  postgres:
    image: postgres:17-alpine
    container_name: longhua-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-longhua}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-longhua}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: longhua-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-longhua}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SERVE_FRONTEND: "true"
      ENABLE_CRON: ${ENABLE_CRON:-true}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      JITSI_BASE_URL: ${JITSI_BASE_URL:-}
      JITSI_JWT_APP_ID: ${JITSI_JWT_APP_ID:-}
      JITSI_JWT_APP_SECRET: ${JITSI_JWT_APP_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@longhua.local}
      # Permanent HDD storage (host path). Survives container recreate.
      UPLOADS_DIR: /mnt/storage/longhua-storage
      # Materials textbooks/videos — Multer + SecureFiles limit (bytes). Default 2 GiB.
      MATERIALS_MAX_UPLOAD_BYTES: ${MATERIALS_MAX_UPLOAD_BYTES:-2147483648}
    volumes:
      - ${LONGHUA_STORAGE_HOST:-/mnt/storage/longhua-storage}:/mnt/storage/longhua-storage
      - backups_data:/app/backups

volumes:
  postgres_data:
  backups_data:
